    <!-- ★ここにJavaScriptをまるごと追加します！ -->
    <script>
      // メニュー開閉の制御
      const menuBtn = document.querySelector(".menu-btn"); // 右上の三本線ボタン
      const closeMenuBtn = document.getElementById("closeMenuBtn"); // メニュー内の×ボタン
      const overlayMenu = document.getElementById("overlayMenu"); // メニュー本体

      // 三本線ボタンを押したらメニューを開く
      menuBtn.addEventListener("click", () => {
        overlayMenu.classList.add("open");
      });

      // ×ボタンを押したらメニューを閉じる
      closeMenuBtn.addEventListener("click", () => {
        overlayMenu.classList.remove("open");
      });

      // リンクを押したときにもメニューを閉じる
      document.querySelectorAll(".menu-links a").forEach((link) => {
        link.addEventListener("click", () => {
          overlayMenu.classList.remove("open");
        });
      });

      document.addEventListener("click", (event) => {
        const overlayMenu = document.querySelector(".overlay-menu");
        const menuBtn = document.querySelector(".menu-btn"); // ハンバーガーボタンのクラス名

        // メニューが現在開いている（openクラスがある）ときだけ処理する
        if (overlayMenu.classList.contains("open")) {
          /*
      クリックされた場所が「メニュー本体」でもなく、
      「メニューを開くボタン（とその中身）」でもない場合、メニューを閉じる
    */
          if (!overlayMenu.contains(event.target) && !menuBtn.contains(event.target)) {
            overlayMenu.classList.remove("open");
          }
        }
      });
    </script>
